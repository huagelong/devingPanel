name: Release desktop builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source:
    name: Verify release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a tag from master
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          git merge-base --is-ancestor HEAD refs/remotes/origin/master

  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    needs: verify-source
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_JOBS: 2
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, arch: x64, runner: ubuntu-24.04, rust_host: x86_64-unknown-linux-gnu }
          - { platform: linux, arch: arm64, runner: ubuntu-24.04-arm, rust_host: aarch64-unknown-linux-gnu }
          - { platform: windows, arch: x64, runner: windows-2022, rust_host: x86_64-pc-windows-msvc }
          - { platform: windows, arch: arm64, runner: windows-11-arm, rust_host: aarch64-pc-windows-msvc }
          - { platform: macos, arch: x64, runner: macos-15-intel, rust_host: x86_64-apple-darwin }
          - { platform: macos, arch: arm64, runner: macos-15, rust_host: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.95
        shell: bash
        run: |
          rustup toolchain install 1.95.0-${{ matrix.rust_host }} --profile minimal --no-self-update
          rustup default 1.95.0-${{ matrix.rust_host }}
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libasound2-dev vulkan-validationlayers libvulkan1
      - name: Build Linux and macOS
        if: matrix.platform != 'windows'
        shell: bash
        run: cargo build --release --locked --bin deving-panel
      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: cargo build --release --locked --bin deving-panel
      - name: Package Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: bash .github/scripts/package-linux.sh '${{ matrix.arch }}'
      - name: Package macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: bash .github/scripts/package-macos.sh '${{ matrix.arch }}'
      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .github/scripts/package-windows.ps1 -Arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: deving-panel-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-source, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "deving-panel") | .version')
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: actions/download-artifact@v4
        with:
          pattern: deving-panel-*
          path: dist
          merge-multiple: true
      - name: Check release files
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "deving-panel") | .version')
          for arch in x64 arm64; do
            if [ "$arch" = x64 ]; then deb_arch=amd64; else deb_arch=arm64; fi
            test -f "dist/deving-panel_${version}_${deb_arch}.deb"
            test -f "dist/deving-panel_${version}_linux_${arch}.AppImage"
            test -f "dist/deving-panel_${version}_windows_${arch}_setup.exe"
            test -f "dist/deving-panel_${version}_windows_${arch}_portable.zip"
            test -f "dist/deving-panel_${version}_macos_${arch}.dmg"
          done
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 10
          find dist -maxdepth 1 -type f -printf '%f\n' | sort
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
