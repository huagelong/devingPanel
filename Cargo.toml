[package]
name = "deving-panel"
version = "0.1.4"
edition = "2024"
rust-version = "1.95"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui-kit = "0.8.0"
image = "0.25.10"
keyring = "4.2"
pbkdf2 = "0.12"
getrandom = "0.3"
rusqlite = { version = "0.41", features = ["bundled"] }
rust-s3 = { version = "0.38", default-features = false, features = ["tokio-rustls-tls", "fail-on-err"] }
serde = { version = "1", features = ["derive"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "macros", "sync", "process", "io-util", "fs"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
yaml-rust2 = "0.13"

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
gpui-pre = { version = "=0.3.9", features = ["test-support"] }
rand = "0.10"
