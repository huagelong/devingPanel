[package]
name = "deving-panel"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui-kit = "0.8.0"
keyring = "4.2"
rusqlite = { version = "0.41", features = ["bundled"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "macros", "sync", "process", "io-util"] }
uuid = { version = "1", features = ["v4"] }
yaml-rust2 = "0.13"

[dev-dependencies]
rand = "0.10"
